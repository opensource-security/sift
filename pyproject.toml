[project]
name = "sift"
version = "0.1.1"
description = "LLM-assisted commit triage for supply-chain security"
requires-python = ">=3.10"

[project.scripts]
sift-commit = "sift.cli.analyze_commit:main"
sift-pr = "sift.cli.analyze_pr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
