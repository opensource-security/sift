[project]
name = "sift"
version = "0.1.2"
description = "LLM-assisted commit triage for supply-chain security — analyzes Git commits and pull requests with Claude to surface security-relevant findings for maintainer review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "opensource-security" },
]
keywords = [
    "supply-chain-security",
    "code-review",
    "llm",
    "git",
    "github-actions",
    "anthropic",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/opensource-security/sift"
Repository = "https://github.com/opensource-security/sift"
Issues = "https://github.com/opensource-security/sift/issues"

[project.optional-dependencies]
# Domain-provenance checks only. The core commit-triage pipeline must stay
# installable and runnable without these; see docs/domain-provenance-plan.md.
provenance = [
    "httpx>=0.27",
    "tldextract>=5.1",
    "idna>=3.6",
    "python-dateutil>=2.9",
    "dnspython>=2.6",
]
# GPG UID parsing deliberately shells out to `gpg --list-packets` rather than
# taking a library dependency. PGPy 0.6.0 (the only maintained option) imports
# `imghdr`, removed from the stdlib in Python 3.13 by PEP 594, so it cannot be
# imported at all on 3.13+. `gpg` is present on GitHub runners and gives more:
# a per-UID binding-signature date instead of one key-wide creation date.

[project.scripts]
sift-commit = "sift.cli.analyze_commit:main"
sift-pr = "sift.cli.analyze_pr:main"
sift-domain = "sift.cli.domain_provenance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
