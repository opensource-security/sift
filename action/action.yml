name: "Sift PR Review"
description: "LLM-assisted commit triage for pull requests — surfaces security-relevant findings for maintainer review"

inputs:
  profile:
    description: "Named profile (overrides provider/model/effort/verifier_count). Available: maintainer_review_v1, maintainer_review_fast_v1, maintainer_review_max_v1"
    required: false
    default: ""
  provider:
    description: "LLM provider: anthropic, openai, or ollama (ignored when profile is set)"
    required: false
    default: "anthropic"
  api_key:
    description: "Provider API key. For provider=anthropic this is the Anthropic key (exported as ANTHROPIC_API_KEY); for provider=openai it is the OpenAI key (exported as OPENAI_API_KEY)."
    required: true
  model:
    description: "Model ID to use. Set an OpenAI model id (e.g. gpt-5.4) when provider=openai."
    required: false
    default: "claude-sonnet-4-20250514"
  thinking:
    description: "Thinking mode: adaptive or off (anthropic only)"
    required: false
    default: "adaptive"
  effort:
    description: "Model effort level. anthropic: low/medium/high/max. openai reasoning_effort: minimal/low/medium/high."
    required: false
    default: "high"
  max_commits:
    description: "Maximum number of PR commits to analyze (0 = no limit)"
    required: false
    default: "0"
  verifier_count:
    description: "Number of verifier variants per finding"
    required: false
    default: "3"
  pr_social_mode:
    description: "PR metadata enrichment: off or current_pr"
    required: false
    default: "off"
  tool_mode:
    description: "Model tool access: none or readonly"
    required: false
    default: "readonly"
  artifact_retention:
    description: "Days to retain uploaded artifacts"
    required: false
    default: "30"
  domain_provenance:
    description: >
      Contributor email-domain provenance: off, redacted, or detail. Detects whether
      the PR author's email domain changed hands since that identity began using it
      (the npm node-ipc / PyPI ctx takeover vector). Installs the sift[provenance]
      extra and makes outbound RDAP/CT requests, so it is off by default.
      "redacted" withholds the domain from all output; "detail" includes it, which on
      a public repository means publishing it — a job summary is not a private channel.
    required: false
    default: "off"

outputs:
  artifact_path:
    description: "Path to the JSON analysis artifact"
    value: ${{ steps.analyze.outputs.artifact_path }}
  summary_path:
    description: "Path to the markdown summary"
    value: ${{ steps.render.outputs.summary_path }}
  commits_analyzed:
    description: "Number of commits analyzed"
    value: ${{ steps.analyze.outputs.commits_analyzed }}
  surviving_findings:
    description: "Number of findings that survived verification"
    value: ${{ steps.analyze.outputs.surviving_findings }}
  review_recommended:
    description: "Whether maintainer review is recommended"
    value: ${{ steps.analyze.outputs.review_recommended }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install sift
      shell: bash
      run: |
        # The provenance extra must be requested explicitly: without it the
        # domain-provenance evidence hook degrades to "unavailable" and the check
        # silently no-ops in production while passing locally.
        if [ "${{ inputs.domain_provenance }}" != "off" ]; then
          pip install --quiet "${{ github.action_path }}/..[provenance]"
        else
          pip install --quiet "${{ github.action_path }}/.."
        fi

    - name: Fetch PR head objects (without checking out PR code)
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Security: only fetch git objects from the PR head — never check out
        # or execute code from the PR branch. Analysis is read-only.
        git fetch --no-tags --prune origin \
          +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}/head
        git cat-file -e "${{ github.event.pull_request.head.sha }}^{commit}"

    - name: Analyze PR commits
      id: analyze
      shell: bash
      env:
        # The selected runner reads only its own key; the same api_key input
        # is exported under both names so either provider can be chosen.
        ANTHROPIC_API_KEY: ${{ inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.api_key }}
        GITHUB_TOKEN: ${{ github.token }}
        # Attaches domain-provenance evidence to the case so the triage model can
        # weigh it against what the patch touches, rather than it being reported
        # as a standalone finding.
        SIFT_DOMAIN_PROVENANCE: ${{ inputs.domain_provenance != 'off' && '1' || '0' }}
      run: |
        mkdir -p artifacts
        PROFILE_ARG=""
        if [ -n "${{ inputs.profile }}" ]; then
          PROFILE_ARG="--profile ${{ inputs.profile }}"
        fi
        # Thread model/effort to the flags for the selected provider. Anthropic
        # is the default; openai maps effort to reasoning_effort.
        if [ "${{ inputs.provider }}" = "openai" ]; then
          PROVIDER_ARGS=(--openai-model "${{ inputs.model }}" --openai-effort "${{ inputs.effort }}")
        else
          PROVIDER_ARGS=(--anthropic-model "${{ inputs.model }}" --anthropic-thinking "${{ inputs.thinking }}" --anthropic-effort "${{ inputs.effort }}")
        fi
        python3 -m sift.cli.analyze_pr \
          --repo-path "$GITHUB_WORKSPACE" \
          --event-json "$GITHUB_EVENT_PATH" \
          $PROFILE_ARG \
          --runner "${{ inputs.provider }}" \
          "${PROVIDER_ARGS[@]}" \
          --verifier-count "${{ inputs.verifier_count }}" \
          --pr-social-mode "${{ inputs.pr_social_mode }}" \
          --anthropic-tool-mode "${{ inputs.tool_mode }}" \
          --limit-commits "${{ inputs.max_commits }}" \
          --output artifacts/sift_pr_analysis.json \
          | tee /tmp/sift_output.txt

        echo "artifact_path=artifacts/sift_pr_analysis.json" >> "$GITHUB_OUTPUT"

        # Parse counts from sift output
        commits=$(grep -oP 'commits=\K\d+' /tmp/sift_output.txt || echo "0")
        surviving=$(grep -oP 'surviving_findings=\K\d+' /tmp/sift_output.txt || echo "0")
        echo "commits_analyzed=$commits" >> "$GITHUB_OUTPUT"
        echo "surviving_findings=$surviving" >> "$GITHUB_OUTPUT"
        if [ "$surviving" -gt "0" ]; then
          echo "review_recommended=true" >> "$GITHUB_OUTPUT"
        else
          echo "review_recommended=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Render markdown summary
      id: render
      shell: bash
      run: |
        python3 -m sift.render.github_summary \
          --input artifacts/sift_pr_analysis.json \
          --output artifacts/sift_pr_summary.md
        cat artifacts/sift_pr_summary.md >> "$GITHUB_STEP_SUMMARY"
        echo "summary_path=artifacts/sift_pr_summary.md" >> "$GITHUB_OUTPUT"

    - name: Contributor domain provenance
      if: ${{ inputs.domain_provenance != 'off' }}
      shell: bash
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # A standalone report for the maintainer, separate from the triage
        # evidence above. Redacted by default: on a public repository the job
        # summary and uploaded artifacts are both world-readable, so there is no
        # maintainer-only channel here, and naming a contributor's expiring
        # personal domain in public output is a targeting notice.
        PUBLIC_FLAG="--public"
        if [ "${{ inputs.domain_provenance }}" = "detail" ]; then
          PUBLIC_FLAG=""
        fi
        # Exit 1 means "anomaly found", which is information, not a failure.
        python3 -m sift.cli.domain_provenance \
          --event-path "$GITHUB_EVENT_PATH" \
          --repo-path "$GITHUB_WORKSPACE" \
          $PUBLIC_FLAG \
          > artifacts/sift_domain_provenance.md || true
        # The JSON carries unredacted domains, so it is only produced in detail
        # mode. Uploaded artifacts are world-readable on a public repository.
        if [ "${{ inputs.domain_provenance }}" = "detail" ]; then
          python3 -m sift.cli.domain_provenance \
            --event-path "$GITHUB_EVENT_PATH" \
            --repo-path "$GITHUB_WORKSPACE" \
            --json \
            > artifacts/sift_domain_provenance.json || true
        fi
        cat artifacts/sift_domain_provenance.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post check run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 -m sift.render.github_check \
          --input artifacts/sift_pr_analysis.json \
          --details-url "$DETAILS_URL" \
          --output artifacts/sift_pr_check.json
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          repos/${{ github.repository }}/check-runs \
          --input artifacts/sift_pr_check.json

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sift-pr-${{ github.event.pull_request.number }}
        retention-days: ${{ inputs.artifact_retention }}
        path: |
          artifacts/sift_pr_analysis.json
          artifacts/sift_pr_summary.md
          artifacts/sift_pr_check.json
          artifacts/sift_domain_provenance.md
          artifacts/sift_domain_provenance.json
        if-no-files-found: ignore
